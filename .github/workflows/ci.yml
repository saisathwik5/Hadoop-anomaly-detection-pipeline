name: Hadoop Anomaly Pipeline CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -e .
      - name: Format and lint
        run: |
          black --check anomaly_pipeline tests
          isort --check-only anomaly_pipeline tests
          flake8 anomaly_pipeline tests --max-line-length=100
      - name: Tests
        run: pytest tests -v --cov=anomaly_pipeline --cov-report=term-missing
